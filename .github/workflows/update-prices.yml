name: Update prices

on:
  schedule:
    - cron: "0 * * * *" # hourly; gate step restricts to 7am/5pm ET
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Gate (run only at 7am/5pm ET, or manual dispatch)
        id: gate
        run: |
          HOUR=$(TZ=America/New_York date +%H)
          echo "ET hour: $HOUR"
          if [ "$HOUR" = "07" ] || [ "$HOUR" = "17" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Scrape
        if: steps.gate.outputs.run == 'true'
        run: python scraper.py --out-dir data

      - name: Commit data
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "gas-tracker bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: prices update ($(TZ=America/New_York date '+%Y-%m-%d %H:%M ET'))"
            git push
          fi