name: On-demand zip lookup

on:
  workflow_dispatch:
    inputs:
      zip:
        description: "5-digit zipcode"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ondemand-${{ github.event.inputs.zip }}
  cancel-in-progress: false

jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Validate zip
        env:
          ZIP: ${{ github.event.inputs.zip }}
        run: |
          [[ "$ZIP" =~ ^[0-9]{5}$ ]] || { echo "invalid zip: $ZIP"; exit 1; }

      - name: Scrape zip
        env:
          ZIP: ${{ github.event.inputs.zip }}
        run: python scraper.py --zip "$ZIP" --out-dir data

      - name: Commit data
        run: |
          git config user.name "gas-tracker bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "ondemand: zip ${{ github.event.inputs.zip }}"
            git push
          fi